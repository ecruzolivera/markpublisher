name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      - name: Install Chromium and browser dependencies
        run: sudo env "PATH=$PATH" ./node_modules/.bin/puppeteer browsers install chrome --install-deps

      - name: Build sample book (HTML + PDF)
        working-directory: samples/sample-book
        run: node ../../src/cli.js build

      - name: Rename output assets
        run: |
          mv "samples/sample-book/output/my sample book.html" samples/sample-book/output/markpublisher-sample.html
          mv "samples/sample-book/output/my sample book.pdf"  samples/sample-book/output/markpublisher-sample.pdf

      - name: Attach example assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            samples/sample-book/output/*.html
            samples/sample-book/output/*.pdf
